<style>
/* Layout: the cast sits up in a soft Seattle sky (clouds drifting, a little sun peeking in); a light sheet below holds one rounded speech bubble per answer. */
:root {
  --sky-a: #c5d3dd;
  --sky-b: #d1dce3;
  --sky-c: #dde5ea;
  --cloud: #edf2f5;
  --cloud-shade: #e2e9ee;
  --sun: transparent;
  --chip: rgba(30, 48, 60, 0.06);
  --band: #d1dce3;
  --band-ink: #1d2a32;
  --band-muted: #66757f;
  --deep: #2a1d18;
  --deep-ink: #f6eee6;
  --deep-muted: #d3c2b6;
  --gold: #c46f50;
  --gold-glow: rgba(234, 180, 154, 0.45);
  --stage: #f5f6f5;
  --surface: #fcfbf9;
  --ink: #16181a;
  --muted: #555a5e;
  --line: #ddd8d1;
  --scrim: rgba(10, 20, 18, 0.5);
  --mix: 21%;

  /* each designer's color: portrait background and bubble tint */
  --c-pr: #5a7bb5; --c-sb: #c9714f; --c-mv: #b8504f; --c-mg: #d39aa0;
  --c-ce: #b98f5c; --c-rl: #4f8c86; --c-sj: #93a6b8; --c-cc: #cbbfa8;

  --thick: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --thin: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-a: #1e272d; --sky-b: #182025; --sky-c: #13191d; --cloud: #222c32; --cloud-shade: #1c252a; --sun: transparent; --chip: rgba(255, 255, 255, 0.08);
    --band: #182025; --band-ink: #e9eef0; --band-muted: #9aa8b0; --deep: #33241e; --deep-ink: #f3ebe2; --deep-muted: #c4b3a7; --gold: #eab49a;
    --stage: #12171a; --surface: #1a2126; --ink: #eef1f2; --muted: #a3adb3; --line: #2b3439;
    --scrim: rgba(0, 0, 0, 0.6); --mix: 25%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-a: #1e272d; --sky-b: #182025; --sky-c: #13191d; --cloud: #222c32; --cloud-shade: #1c252a; --sun: transparent; --chip: rgba(255, 255, 255, 0.08);
    --band: #182025; --band-ink: #e9eef0; --band-muted: #9aa8b0; --deep: #33241e; --deep-ink: #f3ebe2; --deep-muted: #c4b3a7; --gold: #eab49a;
  --stage: #12171a; --surface: #1a2126; --ink: #eef1f2; --muted: #a3adb3; --line: #2b3439;
  --scrim: rgba(0, 0, 0, 0.6); --mix: 25%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--sky-c); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 12px; }
.gut { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { margin: 3px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.app { position: relative; height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: transparent; z-index: 1; }

/* band */
.band { position: relative; color: var(--band-ink); }
.mast { position: relative; padding-block: 14px 0; }
.mast .live { position: absolute; top: 14px; right: max(18px, env(safe-area-inset-right, 0px)); margin: 0; }
.title { white-space: nowrap; }
.title { margin: 0; line-height: .95; }
.title .thin { display: block; font-family: var(--thin); font-style: italic; font-weight: 400; font-size: 19px; letter-spacing: -0.01em; color: var(--band-muted); margin-bottom: 9px; }
.title .thick { font-family: var(--thick); font-weight: 800; font-size: clamp(27px, 7.6vw, 34px); letter-spacing: -0.03em; text-transform: uppercase; }
.title .tail { font-family: var(--thin); font-style: italic; font-weight: 400; font-size: clamp(27px, 7.6vw, 34px); letter-spacing: -0.01em; color: var(--gold); }
.title .dead { position: relative; display: inline-block; }
.live { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; margin-bottom: 6px; border-radius: 8px; background: var(--chip); font-size: 12px; font-weight: 600; color: var(--band-ink); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: #9cbf8f; box-shadow: 0 0 0 0 rgba(156,191,143,.6); animation: ping 2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(156,191,143,.55); } 80%, 100% { box-shadow: 0 0 0 7px rgba(156,191,143,0); } }

.cast { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-block: 16px 14px; }
.cast::-webkit-scrollbar { display: none; }
.who { flex: none; width: 58px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; animation: arrive .6s cubic-bezier(.3,1.4,.5,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
.tile { position: relative; width: 52px; height: 52px; }
.ondot { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: #9cbf8f; border: 2.5px solid var(--band); z-index: 2; }
.av { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--tc); transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; }
.av svg { display: block; width: 100%; height: 100%; }
.who:hover .av { transform: translateY(-3px) rotate(-3deg); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.who.typing .av { animation: chatter .5s ease-in-out infinite alternate; }
@keyframes chatter { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes spin { from { transform: translateY(-2px) rotateY(0); } to { transform: translateY(-2px) rotateY(360deg); } }
.who .nm { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--band-ink); white-space: nowrap; }
.who.away .av { filter: grayscale(.9); opacity: .45; }
.who.away .nm { color: var(--band-muted); font-weight: 500; }
.who.sel .av { box-shadow: 0 0 0 3px var(--band), 0 0 0 5px var(--band-ink); }
.who.speaking .av { box-shadow: 0 0 0 3px var(--band), 0 0 0 5px var(--gold); }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; animation-delay: calc(var(--i, 0) * -730ms); }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.1); } }

/* stage: a light sheet under the band */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--stage); border-radius: 16px 16px 0 0; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.qline { display: flex; align-items: flex-start; gap: 6px; padding-block: 16px 0; }
.qtext { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--thick); font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.asked { margin: 4px 0 0; font-family: var(--thin); font-style: italic; font-size: clamp(23px, 6.2vw, 28px); line-height: 1.08; letter-spacing: -0.01em; overflow-wrap: anywhere; text-wrap: balance; }
.nudge { flex: none; width: 40px; height: 40px; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.nudge:hover { border-color: var(--ink); }

.rounds { flex: 1; min-height: 0; position: relative; }
.carousel {
  position: absolute; inset: 0; display: flex; align-items: flex-start; gap: 12px;
  overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding-block: 16px 8px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  scroll-padding-left: max(18px, env(safe-area-inset-left, 0px));
}
.carousel::-webkit-scrollbar { display: none; }
.card {
  position: relative; flex: 0 0 calc(100% - 34px); max-width: 540px; max-height: 100%; min-width: 0; scroll-snap-align: start;
  display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 14px;
  background: color-mix(in srgb, var(--tc) var(--mix), var(--surface));
  animation: pop .5s cubic-bezier(.3,1.35,.5,1) both;
}
.card::before { content: ""; position: absolute; top: -9px; left: 30px; width: 22px; height: 10px; background: inherit; clip-path: polygon(0 100%, 50% 0, 100% 100%); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.card-h { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
.mini { flex: none; width: 44px; height: 44px; }
.card-h h3 { margin: 0; font-family: var(--thick); font-weight: 800; font-size: 21px; line-height: 1.05; letter-spacing: -0.02em; }
.card-b { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; padding-bottom: 18px; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
.card-b p:not(.medium) { margin: 0; font-size: 15.5px; line-height: 1.6; }
.card-b p.lede { font-size: 17px; font-weight: 600; line-height: 1.5; }
.medium { margin: 2px 0 0; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); font-size: 13px; color: var(--muted); }
.medium b { font-family: var(--thick); font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); margin-right: 6px; }
.card-f { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; }
.card.aside { background: var(--surface); border: 2px dashed color-mix(in srgb, var(--tc) 60%, var(--line)); }
.card.aside::before { display: none; }
.cutin { display: inline-block; margin-bottom: 5px; padding: 3px 9px; border-radius: 999px; background: var(--tc); color: #fff; font-family: var(--thick); font-weight: 800; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }

.ink { animation: show .45s ease-out both; }
@keyframes show { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.dots { display: inline-flex; gap: 5px; padding: 8px 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--ink)); animation: bob 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }

.btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1.5px solid color-mix(in srgb, var(--ink) 25%, transparent); background: transparent; cursor: pointer; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.solid, .btn.link { background: var(--ink); color: var(--stage); border-color: var(--ink); }
.card-f .btn:first-child { background: transparent; color: var(--ink); }

.pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding-block: 0 6px; }
.pg { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.pg:hover:not(:disabled) { border-color: var(--ink); }
.pg:disabled { opacity: .35; cursor: default; }
.marks { display: flex; gap: 6px; align-items: center; }
.marks button { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 999px; background: var(--tc); opacity: .35; cursor: pointer; transition: width .25s, opacity .25s; }
.marks button.on { opacity: 1; width: 26px; }

/* DMs */
.dm-h { display: flex; align-items: center; gap: 12px; padding-block: 18px 12px; border-bottom: 1px solid var(--line); }
.dm-h .t { flex: 1; min-width: 0; }
.dm-h h2 { margin: 0; font-family: var(--thick); font-weight: 800; font-size: 22px; line-height: 1.05; letter-spacing: -0.02em; }
.threads { flex: 1; min-height: 0; position: relative; }
.thread {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px;
  padding-block: 16px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.msg { position: relative; max-width: 84%; min-width: 0; overflow-wrap: anywhere; padding: 11px 16px; border-radius: 14px; animation: pop .4s cubic-bezier(.3,1.35,.5,1) both; }
.msg.them { align-self: flex-start; background: color-mix(in srgb, var(--tc) var(--mix), var(--surface)); border-bottom-left-radius: 4px; }
.msg.them p { margin: 0; }
.msg.me { align-self: flex-end; background: var(--deep); color: var(--deep-ink); border-bottom-right-radius: 4px; }
.sysnote { align-self: center; max-width: 88%; text-align: center; font-family: var(--thin); font-style: italic; font-size: 17px; color: var(--muted); margin: 4px 0; }

/* composer */
.compose { display: flex; flex-direction: column; gap: 10px; padding-block: 10px 14px; background: var(--stage); border-top: 1px solid var(--line); }
.starters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.starters::-webkit-scrollbar { display: none; }
.starters .btn { flex: none; min-height: 36px; font-weight: 600; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); }
.starters .btn:hover { border-color: var(--ink); }
.starters .more-q { display: inline-flex; align-items: center; gap: 6px; background: var(--deep); color: var(--deep-ink); border-color: var(--deep); }
.starters .more-q:hover { border-color: var(--gold); }
.qm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qm-surprise { flex: none; background: var(--gold); color: #16181a; border: 0; font-weight: 700; }
.qm-group { display: flex; flex-direction: column; gap: 8px; }
.qm-group h3, .disclaim h3 { margin: 0; font-family: var(--thick); font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.qm-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.qm-chips .btn { white-space: normal; max-width: 100%; line-height: 1.3; padding-block: 8px; min-height: 36px; font-weight: 600; font-size: 13.5px; text-align: left; background: var(--surface); border: 1px solid var(--line); }
.qm-chips .btn:hover { border-color: var(--ink); }
.qm-back { align-self: flex-start; }
.disclaim { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.disclaim p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.bar { display: flex; align-items: flex-end; gap: 8px; padding: 5px 5px 5px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.bar:focus-within { border-color: var(--ink); }
.bar textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none; font: 16px/1.4 var(--sans); color: var(--ink); padding: 10px 0; min-height: 44px; max-height: 110px; }
.bar textarea::placeholder { color: var(--muted); }
.send { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--gold); color: #16181a; cursor: pointer; display: grid; place-items: center; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
.send:not(:disabled):hover { transform: rotate(-12deg) scale(1.05); }
.send:disabled { opacity: .35; cursor: default; }

/* share */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%; max-height: 92%; overflow-y: auto; background: var(--stage); border-radius: 16px 16px 0 0;
  display: flex; flex-direction: column; gap: 14px; animation: pop .3s ease-out;
  padding-block: 22px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.sheet h2 { margin: 0; font-family: var(--thick); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; }
.poster { border-radius: 14px; overflow: hidden; background: var(--deep); color: var(--deep-ink); display: flex; flex-direction: column; }
.poster .top { padding: 24px 22px 18px; display: flex; flex-direction: column; gap: 8px; }
.poster .top span { font-family: var(--thick); font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.poster .q { margin: 0; font-family: var(--thin); font-style: italic; font-size: 30px; line-height: 1.04; }
.poster .body { margin: 0 12px; padding: 18px; border-radius: 10px; background: color-mix(in srgb, var(--tc) 30%, #fbfbf9); color: #16181a; display: flex; flex-direction: column; gap: 12px; }
.poster .a { margin: 0; font-size: 14.5px; line-height: 1.55; }
.poster .by { display: flex; align-items: center; gap: 10px; }
.poster .by b { display: block; font-family: var(--thick); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
.poster .by .label { color: #555a5e; }
.poster .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 22px 18px; font-size: 12px; font-weight: 700; color: var(--deep-muted); }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet .note { margin: 0; font-size: 12.5px; color: var(--muted); }
.toast { position: absolute; z-index: 30; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--deep); color: var(--deep-ink); font-size: 14px; font-weight: 700; padding: 9px 18px; border-radius: 999px; animation: fade .2s ease-out; }

/* reading mode: an eased, staggered fold. The names fade first, the portraits shrink in a left-to-right wave,
   the title lifts away and the composer sinks; reversing plays it back the other way. */
.app { --ease: cubic-bezier(.22, 1, .36, 1); --bounce: cubic-bezier(.3, 1.22, .45, 1); --dur: .48s; }
.mast { max-height: var(--h, 120px); overflow: hidden; transition: max-height var(--dur) var(--ease), padding var(--dur) var(--ease), opacity .3s ease, transform var(--dur) var(--ease); }
.cast { transition: padding var(--dur) var(--ease); }
.who { transition: width var(--dur) var(--bounce), gap var(--dur) var(--ease); transition-delay: calc(var(--i, 0) * 16ms); }
.tile { transition: width var(--dur) var(--bounce), height var(--dur) var(--bounce); transition-delay: calc(var(--i, 0) * 16ms); }
.who .nm { max-height: 18px; overflow: hidden; transition: max-height .4s var(--ease), opacity .2s ease; }
.ondot { transition: transform var(--dur) var(--bounce); transform-origin: bottom right; }
.qline { transition: padding var(--dur) var(--ease); }
.qline .eyebrow { display: block; max-height: 20px; overflow: hidden; transition: max-height .4s var(--ease), opacity .25s ease; }
.asked { transition: font-size var(--dur) var(--ease); }
.compose { max-height: var(--h, 240px); overflow: hidden; transition: max-height var(--dur) var(--ease), padding var(--dur) var(--ease), opacity .3s ease, transform var(--dur) var(--ease); }
.card { transition: box-shadow .5s ease; }

.app.reading .mast { max-height: 0; padding-top: 0; opacity: 0; transform: translateY(-14px); }
.app.reading .cast { padding-block: 10px 10px; }

    h.append(mini(id), t, btn('← Everyone', '', () => go('group')));
  }

  // ---------- live presence: artists drift in and out, but never the ones you're talking to ----------
  let chipT = 0;
  function chip(msg) {
    const live = $('#live-n').parentNode;
    live.lastChild.textContent = msg ? '' : '\u00a0online';
    $('#live-n').textContent = msg || online.size;
    clearTimeout(chipT);
    if (msg) chipT = setTimeout(() => chip(null), 3200);
  }
  function setOnline(id, on, note) {
    if (online.has(id) === on) return;
    if (on) online.add(id); else online.delete(id);
    paintEveryone();
    const b = castEl.querySelector('[data-id="' + id + '"]');
    if (b) {
      b.classList.toggle('away', !on);
      const tile = b.querySelector('.tile'), dot = tile.querySelector('.ondot');
      if (on && !dot) tile.appendChild(el('span', 'ondot')); else if (!on && dot) dot.remove();
      b.setAttribute('aria-label', A[id].name + (on ? ', online, ' + A[id].on : ', away, ' + A[id].off) + '. Message privately.');
    }
    chip(note === false ? null : (on ? A[id].short + ' just arrived' : A[id].short + ' stepped out'));
    if (state.view === id) renderDmHead(id);
  }
  function engaged() {
    const set = new Set();
    if (state.view !== 'group') set.add(state.view);
    if (rounds[cur]) rounds[cur].cards.forEach((c) => set.add(c.id));
    castEl.querySelectorAll('.who.typing').forEach((b) => set.add(b.dataset.id));
    return set;
  }
  function presenceTick() {
    const busy = engaged();
    const canLeave = [...online].filter((id) => !busy.has(id));
    const away = IDS.filter((id) => !online.has(id));
    const leave = online.size > 3 && canLeave.length && (online.size >= 6 || Math.random() < 0.5);
    if (leave) setOnline(canLeave[Math.floor(Math.random() * canLeave.length)], false);
    else if (away.length) setOnline(away[Math.floor(Math.random() * away.length)], true);
    setTimeout(presenceTick, 9000 + Math.random() * 8000);
  }
  setTimeout(presenceTick, 7000);

  function go(view) {
    state.view = view; setFocus(false);
    if (view !== 'group' && !online.has(view)) {
      setTimeout(() => {
        if (state.view !== view || online.has(view)) return;
        setOnline(view, true);
        const t = thread(view); t.appendChild(el('p', 'sysnote', A[view].short + ' saw you knocking and came online.'));
        if (!t._greeted) { t._greeted = true; setTimeout(() => themBubble(t, view, A[view].hi, true), 500); }
        t.scrollTop = t.scrollHeight;
      }, 1100);
    }
    const group = view === 'group';
    $('#salon').hidden = !group; $('#dm').hidden = group; $('#pager').hidden = !group;
    if (!group) {
      renderDmHead(view);
      const t = thread(view);
      Object.keys(threads).forEach((k) => { threads[k].hidden = k !== view; });
      t.scrollTop = t.scrollHeight;
    } else requestAnimationFrame(updatePager);
    $('#q').placeholder = group ? 'Ask the afterlife anything…' : 'Message ' + A[view].short + '…';
    updateCast(); scrollCastTo(view); closeSheets();
  }

  // ---------- asking ----------
  const ALIAS = { pr: /\brand\b|paul/i, sb: /saul|\bbass\b/i, mv: /vignelli|massimo/i, mg: /glaser|milton/i, ce: /eames|charles|\bray\b/i, rl: /loewy|raymond/i, sj: /jobs|steve/i, cc: /chanel|coco/i };
  function responders(text) {
    const out = IDS.filter((id) => ALIAS[id].test(text)).slice(0, 3);
    const pool = [...online].sort(() => Math.random() - .5).concat(IDS.filter((id) => !online.has(id)).sort(() => Math.random() - .5));
    for (const id of pool) { if (out.length >= 4) break; if (!out.includes(id)) out.push(id); }
    return out;
  }
  function pickBanter(answered) {
    const ok = BANTER.filter(([from, to]) => online.has(from) && !answered.includes(from) && (to === null || answered.includes(to)));
    return ok.length ? ok[Math.floor(Math.random() * ok.length)] : null;
  }
  async function ask(textIn) {
    const q = $('#q');
    const text = (textIn != null ? textIn : q.value).trim();
    if (text) closeSheets();
    if (!text || state.busy) return;
    q.value = ''; autosize(); $('#send').disabled = true; state.busy = true;
    const topic = topicOf(text);
    if (state.view === 'group') {
      const r = newRound(text), who = responders(text);
      who.forEach((id) => setOnline(id, true));
      const cards = who.map((id) => addCard(r, id));
      cards.forEach((c) => { c.dots = dotsEl(); c.body.appendChild(c.dots); setTyping(c.id, true); });
      goCard(r, 0);
      for (let i = 0; i < cards.length; i++) {
        await wait(i === 0 ? 700 : 220);
        fillCard(cards[i], linesFor(cards[i].id, topic));
      }
      if (topic !== 'crisis' && topic !== 'greet' && Math.random() < 0.65) {
        const b = pickBanter(who);
        if (b) { await wait(300); fillCard(addCard(r, b[0], { aside: true }), [b[2]]); }
      }
      roundsAsked++;
      if (roundsAsked === 2 && !ninoShown) { ninoShown = true; await wait(500); addNinoCard(r); }
    } else {
      const id = state.view, t = thread(id);
      meBubble(t, text); t._greeted = true; setOnline(id, true); setTyping(id, true);
      const m = themBubble(t, id, null, false);
      const d = dotsEl(); m.appendChild(d); t.scrollTop = t.scrollHeight;
      await wait(800);
      m.remove(); setTyping(id, false);
      const lines = linesFor(id, topic);
      let firstNew = null;
      for (let i = 0; i < lines.length; i++) { const nb = themBubble(t, id, lines[i], true); if (!firstNew) firstNew = nb; await wait(90); }
      if (firstNew) t.scrollTop = Math.max(0, firstNew.offsetTop - 70);
    }
    state.busy = false; $('#send').disabled = !q.value.trim();
  }

  // ---------- share ----------
  function closeSheets() { const bar = document.querySelector('.bar'); if (bar && bar.closest('.scrim')) $('#bar-home').appendChild(bar); document.querySelectorAll('.scrim').forEach((s) => s.remove()); }
  function openShare(c) {
    closeSheets();
    const a = A[c.id], text = c.lines.join(' ');
    const scrim = el('div', 'scrim'); scrim.onclick = (e) => { if (e.target === scrim) scrim.remove(); };
    const s = el('div', 'sheet'); s.setAttribute('role', 'dialog'); s.setAttribute('aria-modal', 'true'); s.setAttribute('aria-label', 'Share this answer');
    s.appendChild(el('h2', null, 'Share this answer'));
    const p = tint(el('div', 'poster'), c.id);
    const top = el('div', 'top'); top.append(el('span', null, 'I asked the dead masters'), el('p', 'q', c.q));
    const body = el('div', 'body');
    body.appendChild(el('p', 'a', '\u201c' + text + '\u201d'));
    const by = el('div', 'by'), bt = el('div');
    bt.append(el('b', null, a.name), el('span', 'label', a.origin + ', ' + a.years));
    by.append(mini(c.id), bt); body.appendChild(by);
    const foot = el('div', 'foot'); foot.append(el('span', null, 'What Would Dead Designers Do'), el('span', null, 'by Nino Studio'));
    p.append(top, body, foot); s.appendChild(p);
    const row = el('div', 'row');
    row.append(
      btn('Copy text', 'solid', async () => {
        const out = 'I asked the dead masters: ' + c.q + '\n\n' + a.name + ': “' + text + '”\n\nstilllife.nino.studio';
        try { await navigator.clipboard.writeText(out); toast('Copied'); } catch (e) { toast('Copy didn’t work here'); }
      }),
      btn('Done', '', closeSheets)
    );
    s.appendChild(row);
    s.appendChild(el('p', 'note', 'In the real app this saves as an image sized for Instagram.'));
    scrim.appendChild(s); $('#app').appendChild(scrim);
    s.querySelector('button').focus();
  }
  function toast(t) { const n = el('div', 'toast', t); $('#app').appendChild(n); setTimeout(() => n.remove(), 1600); }

  // ---------- reading mode: tap a reply to expand it, tap again to bring everything back ----------
  const appEl = $('#app');
  function setFocus(on) {
    if (on) ['.mast', '.compose'].forEach((sel) => { const e = $(sel); e.style.setProperty('--h', e.scrollHeight + 'px'); });
    appEl.classList.toggle('reading', on); if (on && perched) doveLeave();
    if (!on) setTimeout(() => { if (!appEl.classList.contains('reading')) ['.mast', '.compose'].forEach((sel) => $(sel).style.removeProperty('--h')); }, 600);
  }
  function onReplyTap(e) {
    if (e.target.closest('button, a')) return;
    if (!e.target.closest('.card-b, .msg.them')) return;
    const sel = window.getSelection && window.getSelection();
    if (sel && String(sel).length > 0) return; // they were selecting text, not tapping
    setFocus(!appEl.classList.contains('reading'));
  }
  $('#rounds').addEventListener('click', onReplyTap);
  $('#threads').addEventListener('click', onReplyTap);
  $('.qline').addEventListener('click', (e) => { if (!e.target.closest('button')) setFocus(false); });

  // ---------- the living one: Nino ----------
  const NINO = {"eyebrow": "Living designer · Seattle", "lines": ["Hi, I’m Nino. The only designer in this chat with a pulse.", "Nearly 30 years designing products, at Microsoft, Amazon and Oracle among others. Also a painter in Seattle.", "Curious what a living designer is making?"], "links": [["See my design work", "https://nino.studio/pages/design"], ["LinkedIn", "https://www.linkedin.com/in/ninoy"], ["My art", "https://nino.studio"]]};
  function ninoLinks() {
    const box = el('div', 'nino-links');
    NINO.links.forEach(([label, href]) => { const a = el('a', null, label); a.href = href; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); });
    return box;
  }
  let roundsAsked = 0, ninoShown = false;
  function addNinoCard(r) {
    const card = el('article', 'card nino');
    card.style.setProperty('--tc', 'var(--gold)');
    const head = el('header', 'card-h'), t = el('div');
    t.append(el('h3', null, 'Nino Yuniardi'), el('p', 'label', NINO.eyebrow));
    head.append(el('span', 'nino-av', 'N'), t);
    const body = el('div', 'card-b');
    NINO.lines.forEach((line, i) => addPara(body, line, true));
    card.append(head, body, ninoLinks());
    r.car.appendChild(card);
    r.cards.push({ id: 'nino', el: card, body, lines: [], aside: true });
    updatePager();
  }
  function openAbout() {
    closeSheets();
    const scrim = el('div', 'scrim'); scrim.onclick = (e) => { if (e.target === scrim) scrim.remove(); };
    const s2 = el('div', 'sheet ns'); s2.setAttribute('role', 'dialog'); s2.setAttribute('aria-modal', 'true'); s2.setAttribute('aria-label', 'About Nino Studio');
    const x = el('button', 'ns-close'); x.type = 'button'; x.setAttribute('aria-label', 'Back to the chat'); x.onclick = closeSheets;
    x.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    s2.appendChild(x);
    s2.appendChild(el('p', 'ns-eyebrow', 'Nino Studio · Seattle'));
    s2.appendChild(el('h2', null, 'Made by a living designer.'));
    s2.appendChild(el('p', 'ns-sub', 'The only one in this chat with a pulse.'));
    s2.appendChild(el('p', 'ns-body', 'I’m Nino, a designer and painter in Seattle. Nearly thirty years of designing products, at Microsoft, Amazon and Oracle among others.'));
    s2.appendChild(el('p', 'ns-body', 'Curious what a living designer is making now? Come say hi.'));
    const ctas = el('div', 'ns-ctas');
    [['See my design work', 'https://nino.studio/pages/design'], ['LinkedIn', 'https://www.linkedin.com/in/ninoy'], ['The dead artists', '/']].forEach(([label, href]) => {
      const a = el('a', null, label); a.href = href; if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; } ctas.appendChild(a);
    });
    s2.appendChild(ctas);
    const fine = el('div', 'ns-fine');
    fine.appendChild(el('p', 'ns-eyebrow', 'The fine print'));
    fine.appendChild(el('p', null, 'This is a comedy. These designers never said any of this. The jokes are built on real facts from their lives, but every word is made up.'));
    fine.appendChild(el('p', null, 'Please don’t fire your client, wear one turtleneck forever or redraw the subway map because a dead designer told you to. Nothing here is professional, financial, legal or medical advice.'));
    s2.appendChild(fine);
    scrim.appendChild(s2); $('#app').appendChild(scrim);
    ctas.querySelector('a').focus();
  }
  $('#madeby').addEventListener('click', openAbout);

  // ---------- the dove: drops in on a random artist now and then ----------
  const doveEl = $('#dove');
  let doveBusy = false, lastPerch = null, perchT = 0, perched = null;
  const DW = 38, DH = 28;
  const T = (x, y, r, s) => 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scaleX(' + s + ') rotate(' + r + 'deg)';
  function scheduleDove(ms) { setTimeout(doveVisit, ms != null ? ms : 12000 + Math.random() * 14000); }
  function doveAnimate(frames, opts) { const old = doveEl.getAnimations(); const a = doveEl.animate(frames, Object.assign({ fill: 'forwards' }, opts)); old.forEach((o) => o.cancel()); return a; }
  function doveTargets() {
    const cr = castEl.getBoundingClientRect();
    return [...castEl.querySelectorAll('.who')].filter((b) => {
      if (b.dataset.id === 'group' || !online.has(b.dataset.id) || b.dataset.id === lastPerch) return false;
      const r = b.querySelector('.tile').getBoundingClientRect();
      return r.left >= cr.left + 2 && r.right <= cr.right - 2;
    });
  }
  function doveVisit() {
    if (doveBusy || document.hidden || appEl.classList.contains('reading')) return scheduleDove();
    const ts = doveTargets();
    if (!ts.length) return scheduleDove();
    const b = ts[Math.floor(Math.random() * ts.length)];
    lastPerch = b.dataset.id; doveBusy = true;
    const ar = appEl.getBoundingClientRect(), tr = b.querySelector('.tile').getBoundingClientRect();
    const tx = tr.left - ar.left + tr.width / 2 - DW / 2 + 3, ty = tr.top - ar.top - DH * 0.82;
    const fromLeft = Math.random() < 0.5, dir = fromLeft ? 1 : -1;
    const sx = fromLeft ? -90 : ar.width + 90, sy = -50 + Math.random() * 40;
    if (reduce) {
      doveEl.classList.add('perched'); doveEl.style.opacity = 1;
      const f = doveAnimate([{ transform: T(tx, ty, 0, dir), opacity: 0 }, { transform: T(tx, ty, 0, dir), opacity: 1 }], { duration: 700, easing: 'ease-out' });
      f.onfinish = () => { perched = { tx, ty, dir }; perchT = setTimeout(doveLeave, 6000 + Math.random() * 4000); };
      return;
    }
    doveEl.classList.remove('perched'); doveEl.classList.add('flying'); doveEl.style.opacity = 1;
    const a = doveAnimate([
      { transform: T(sx, sy, -8, dir) },
      { transform: T((sx + tx) / 2, Math.min(sy, ty) - 34, -12, dir), offset: 0.55 },
      { transform: T(tx - dir * 6, ty - 12, 6, dir), offset: 0.88 },
      { transform: T(tx, ty, 0, dir) }
    ], { duration: 2300, easing: 'cubic-bezier(.33,.1,.3,1)' });
    a.onfinish = () => {
      doveEl.classList.remove('flying'); doveEl.classList.add('perched');
      perched = { tx, ty, dir };
      perchT = setTimeout(doveLeave, 4500 + Math.random() * 4000);
    };
  }
  function doveLeave() {
    if (!perched) return;
    clearTimeout(perchT);
    const { tx, ty } = perched; perched = null;
    if (reduce) {
      const f = doveAnimate([{ transform: T(tx, ty, 0, 1), opacity: 1 }, { transform: T(tx, ty, 0, 1), opacity: 0 }], { duration: 600, easing: 'ease-in' });
      f.onfinish = () => { doveEl.style.opacity = 0; doveEl.classList.remove('perched'); doveBusy = false; scheduleDove(); };
      return;
    }
    const ar = appEl.getBoundingClientRect();
    const out = Math.random() < 0.5 ? 1 : -1, ex = out > 0 ? ar.width + 100 : -100;
    doveEl.classList.remove('perched'); doveEl.classList.add('flying');
    const a = doveAnimate([
      { transform: T(tx, ty, 0, out) },
      { transform: T(tx + out * 30, ty - 26, -14, out), offset: 0.22 },
      { transform: T(ex, -80, -8, out) }
    ], { duration: 2000, easing: 'cubic-bezier(.45,0,.6,1)' });
    a.onfinish = () => { doveEl.style.opacity = 0; doveEl.classList.remove('flying'); doveBusy = false; scheduleDove(); };
  }
  castEl.addEventListener('scroll', () => { if (perched) doveLeave(); }, { passive: true });
  window.addEventListener('resize', () => { if (perched) doveLeave(); });
  scheduleDove(3500);

  // ---------- composer ----------
  const q = $('#q');
  function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 110) + 'px'; }
  q.addEventListener('input', () => { autosize(); $('#send').disabled = !q.value.trim() || state.busy; });
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });
  $('#send').addEventListener('click', () => ask());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  function openQMenu() {
    closeSheets();
    const scrim = el('div', 'scrim'); scrim.onclick = (e) => { if (e.target === scrim) closeSheets(); };
    const s2 = el('div', 'sheet qmenu'); s2.setAttribute('role', 'dialog'); s2.setAttribute('aria-modal', 'true'); s2.setAttribute('aria-label', 'Ask a question');
    const head = el('div', 'qm-head');
    const group = state.view === 'group';
    head.append(el('h2', null, group ? 'Ask the afterlife' : 'Message ' + A[state.view].short), btn('Surprise me', 'qm-surprise', () => {
      const all = QMENU.flatMap((g) => g[1]); ask(all[Math.floor(Math.random() * all.length)]); closeSheets();
    }));
    s2.appendChild(head);
    s2.appendChild($('.bar'));
    s2.appendChild(el('p', 'note', group ? 'Type your own, or pick one below. Everyone online answers.' : 'Type your own, or pick one below.'));
    QMENU.forEach(([label, qs]) => {
      const g = el('section', 'qm-group');
      g.appendChild(el('h3', null, label));
      const row = el('div', 'qm-chips');
      qs.forEach((qq) => row.appendChild(btn(qq, '', () => { closeSheets(); ask(qq); })));
      g.appendChild(row); s2.appendChild(g);
    });
    scrim.appendChild(s2); $('#app').appendChild(scrim);
    autosize();
    if (window.matchMedia('(hover: hover)').matches) q.focus(); else s2.querySelector('textarea').focus({ preventScroll: true });
  }
  const moreB = btn('', 'more-q', openQMenu);
  moreB.setAttribute('aria-label', 'Ask your own question or see more');
  moreB.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  $('#starters').appendChild(moreB);
  STARTERS.forEach((s) => $('#starters').appendChild(btn(s, '', () => ask(s))));
  $('#pg-prev').onclick = () => { const r = rounds[cur]; goCard(r, activeIdx(r) - 1); };
  $('#pg-next').onclick = () => { const r = rounds[cur]; goCard(r, activeIdx(r) + 1); };
  $('#q-prev').onclick = () => showRound(cur - 1);
  $('#q-next').onclick = () => showRound(cur + 1);

  // ---------- opening state: an example round ----------
  buildCast();
  const sampleQ = 'Is the design profession dead because of AI?';
  const r0 = newRound(sampleQ);
  const firstTwo = castOrder.slice(0, 4);
  firstTwo.forEach((id) => { const c = addCard(r0, id); seenT[id + ':designdead'] = 1; L[id].designdead.forEach((line) => { addPara(c.body, line, false); c.lines.push(line); }); finishCard(c); });
  const b0 = pickBanter(firstTwo);
  if (b0) { const c = addCard(r0, b0[0], { aside: true }); addPara(c.body, b0[2], false); c.lines.push(b0[2]); }
  updatePager(); updateCast();
})();
</script>
</body>

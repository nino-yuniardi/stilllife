<style>
/* Layout: a deep green salon band holds the cast; a light sheet slides up beneath it with one rounded speech bubble per answer. */
:root {
  --band: #2a1d18;
  --band-ink: #f6eee6;
  --band-muted: #d3c2b6;
  --gold: #eab49a;
  --gold-glow: rgba(234, 180, 154, 0.45);
  --stage: #f3f1ed;
  --surface: #fcfbf9;
  --ink: #16181a;
  --muted: #555a5e;
  --line: #ddd8d1;
  --scrim: rgba(10, 20, 18, 0.5);
  --mix: 24%;

  /* each artist's color: portrait background and bubble tint */
  /* Seattle: market marigold, Sound blue, Japanese Garden moss, sockeye, rhododendron, madrona, ferry wake, Douglas fir */
  --c-vg: #d4a849; --c-pp: #6f8fa8; --c-cm: #8fa77f; --c-fk: #d2826b;
  --c-aw: #cf93a6; --c-sd: #a5543f; --c-jp: #a8a29a; --c-br: #4f735c;

  --thick: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --thin: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band: #160f0c; --band-ink: #f3ebe2; --band-muted: #c4b3a7;
    --stage: #151312; --surface: #1f1b19; --ink: #f2ece6; --muted: #b2aaa3; --line: #35302c;
    --scrim: rgba(0, 0, 0, 0.6); --mix: 30%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band: #160f0c; --band-ink: #f3ebe2; --band-muted: #c4b3a7;
  --stage: #151312; --surface: #1f1b19; --ink: #f2ece6; --muted: #b2aaa3; --line: #35302c;
  --scrim: rgba(0, 0, 0, 0.6); --mix: 30%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--band); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 12px; }
.gut { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { margin: 3px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.app { position: relative; height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--band); }

/* band */
.band { color: var(--band-ink); }
.mast { position: relative; padding-block: 14px 0; }
.mast .live { position: absolute; top: 14px; right: max(18px, env(safe-area-inset-right, 0px)); margin: 0; }
.title { white-space: nowrap; }
.title { margin: 0; line-height: .95; }
.title .thin { display: block; font-family: var(--thin); font-style: italic; font-weight: 400; font-size: 19px; letter-spacing: -0.01em; color: var(--band-muted); margin-bottom: 9px; }
.title .thick { font-family: var(--thick); font-weight: 800; font-size: clamp(27px, 7.6vw, 34px); letter-spacing: -0.03em; text-transform: uppercase; }
.title .tail { font-family: var(--thin); font-style: italic; font-weight: 400; font-size: clamp(27px, 7.6vw, 34px); letter-spacing: -0.01em; color: var(--gold); }
.title .dead { position: relative; display: inline-block; }
.live { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; margin-bottom: 6px; border-radius: 8px; background: rgba(255,255,255,.1); font-size: 12px; font-weight: 600; color: var(--band-ink); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: #9cbf8f; box-shadow: 0 0 0 0 rgba(156,191,143,.6); animation: ping 2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(156,191,143,.55); } 80%, 100% { box-shadow: 0 0 0 7px rgba(156,191,143,0); } }

.cast { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-block: 16px 14px; }
.cast::-webkit-scrollbar { display: none; }
.who { flex: none; width: 58px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; animation: arrive .6s cubic-bezier(.3,1.4,.5,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
.tile { position: relative; width: 52px; height: 52px; }
.ondot { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: #9cbf8f; border: 2.5px solid var(--band); z-index: 2; }
.av { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--tc); transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; }
.av svg { display: block; width: 100%; height: 100%; }
.who:hover .av { transform: translateY(-3px) rotate(-3deg); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.who.typing .av { animation: chatter .5s ease-in-out infinite alternate; }
@keyframes chatter { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes spin { from { transform: translateY(-2px) rotateY(0); } to { transform: translateY(-2px) rotateY(360deg); } }
.who .nm { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--band-ink); white-space: nowrap; }
.who.away .av { filter: grayscale(.9); opacity: .45; }
.who.away .nm { color: var(--band-muted); font-weight: 500; }
.who.sel .av { box-shadow: 0 0 0 3px var(--band), 0 0 0 5px var(--band-ink); }
.who.speaking .av { box-shadow: 0 0 0 3px var(--band), 0 0 0 5px var(--gold); }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; animation-delay: calc(var(--i, 0) * -730ms); }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.1); } }

/* stage: a light sheet under the band */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--stage); border-radius: 16px 16px 0 0; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.qline { display: flex; align-items: flex-start; gap: 6px; padding-block: 16px 0; }
.qtext { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--thick); font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.asked { margin: 4px 0 0; font-family: var(--thin); font-style: italic; font-size: clamp(23px, 6.2vw, 28px); line-height: 1.08; letter-spacing: -0.01em; overflow-wrap: anywhere; text-wrap: balance; }
.nudge { flex: none; width: 40px; height: 40px; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.nudge:hover { border-color: var(--ink); }

.rounds { flex: 1; min-height: 0; position: relative; }
.carousel {
  position: absolute; inset: 0; display: flex; align-items: flex-start; gap: 12px;
  overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding-block: 16px 8px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  scroll-padding-left: max(18px, env(safe-area-inset-left, 0px));
}
.carousel::-webkit-scrollbar { display: none; }
.card {
  position: relative; flex: 0 0 calc(100% - 34px); max-width: 540px; max-height: 100%; min-width: 0; scroll-snap-align: start;
  display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 14px;
  background: color-mix(in srgb, var(--tc) var(--mix), var(--surface));
  animation: pop .5s cubic-bezier(.3,1.35,.5,1) both;
}
.card::before { content: ""; position: absolute; top: -9px; left: 30px; width: 22px; height: 10px; background: inherit; clip-path: polygon(0 100%, 22% 0, 100% 100%); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.card-h { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
.mini { flex: none; width: 44px; height: 44px; }
.card-h h3 { margin: 0; font-family: var(--thick); font-weight: 800; font-size: 21px; line-height: 1.05; letter-spacing: -0.02em; }
.card-b { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; padding-bottom: 18px; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
.card-b p:not(.medium) { margin: 0; font-size: 15.5px; line-height: 1.6; }
.card-b p.lede { font-size: 17px; font-weight: 600; line-height: 1.5; }
.medium { margin: 2px 0 0; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); font-size: 13px; color: var(--muted); }
.medium b { font-family: var(--thick); font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); margin-right: 6px; }
.card-f { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; }
.card.aside { background: var(--surface); border: 2px dashed color-mix(in srgb, var(--tc) 60%, var(--line)); }
.card.aside::before { display: none; }
.cutin { display: inline-block; margin-bottom: 5px; padding: 3px 9px; border-radius: 999px; background: var(--tc); color: #fff; font-family: var(--thick); font-weight: 800; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }

.ink { animation: show .45s ease-out both; }
@keyframes show { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.dots { display: inline-flex; gap: 5px; padding: 8px 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--ink)); animation: bob 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }

.btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1.5px solid color-mix(in srgb, var(--ink) 25%, transparent); background: transparent; cursor: pointer; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.solid, .btn.link { background: var(--ink); color: var(--stage); border-color: var(--ink); }
.card-f .btn:first-child { background: transparent; color: var(--ink); }

.pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding-block: 0 6px; }
.pg { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.pg:hover:not(:disabled) { border-color: var(--ink); }
.pg:disabled { opacity: .35; cursor: default; }
.marks { display: flex; gap: 6px; align-items: center; }
.marks button { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 999px; background: var(--tc); opacity: .35; cursor: pointer; transition: width .25s, opacity .25s; }
.marks button.on { opacity: 1; width: 26px; }

/* DMs */
.dm-h { display: flex; align-items: center; gap: 12px; padding-block: 18px 12px; border-bottom: 1px solid var(--line); }
.dm-h .t { flex: 1; min-width: 0; }
.dm-h h2 { margin: 0; font-family: var(--thick); font-weight: 800; font-size: 22px; line-height: 1.05; letter-spacing: -0.02em; }
.threads { flex: 1; min-height: 0; position: relative; }
.thread {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px;
  padding-block: 16px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.msg { position: relative; max-width: 84%; min-width: 0; overflow-wrap: anywhere; padding: 11px 16px; border-radius: 14px; animation: pop .4s cubic-bezier(.3,1.35,.5,1) both; }
.msg.them { align-self: flex-start; background: color-mix(in srgb, var(--tc) var(--mix), var(--surface)); border-bottom-left-radius: 4px; }
.msg.them p { margin: 0; }
.msg.me { align-self: flex-end; background: var(--band); color: var(--band-ink); border-bottom-right-radius: 4px; }
.sysnote { align-self: center; max-width: 88%; text-align: center; font-family: var(--thin); font-style: italic; font-size: 17px; color: var(--muted); margin: 4px 0; }

/* composer */
.compose { display: flex; flex-direction: column; gap: 10px; padding-block: 10px 14px; background: var(--stage); border-top: 1px solid var(--line); }
.starters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.starters::-webkit-scrollbar { display: none; }
.starters .btn { flex: none; min-height: 36px; font-weight: 600; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); }
.starters .btn:hover { border-color: var(--ink); }
.bar { display: flex; align-items: flex-end; gap: 8px; padding: 5px 5px 5px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.bar:focus-within { border-color: var(--ink); }
.bar textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none; font: 16px/1.4 var(--sans); color: var(--ink); padding: 10px 0; min-height: 44px; max-height: 110px; }
.bar textarea::placeholder { color: var(--muted); }
.send { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--gold); color: #16181a; cursor: pointer; display: grid; place-items: center; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
.send:not(:disabled):hover { transform: rotate(-12deg) scale(1.05); }
.send:disabled { opacity: .35; cursor: default; }

/* share */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%; max-height: 92%; overflow-y: auto; background: var(--stage); border-radius: 16px 16px 0 0;
  display: flex; flex-direction: column; gap: 14px; animation: pop .3s ease-out;
  padding-block: 22px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.sheet h2 { margin: 0; font-family: var(--thick); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; }
.poster { border-radius: 14px; overflow: hidden; background: var(--band); color: var(--band-ink); display: flex; flex-direction: column; }
.poster .top { padding: 24px 22px 18px; display: flex; flex-direction: column; gap: 8px; }
.poster .top span { font-family: var(--thick); font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.poster .q { margin: 0; font-family: var(--thin); font-style: italic; font-size: 30px; line-height: 1.04; }
.poster .body { margin: 0 12px; padding: 18px; border-radius: 10px; background: color-mix(in srgb, var(--tc) 30%, #fbfbf9); color: #16181a; display: flex; flex-direction: column; gap: 12px; }
.poster .a { margin: 0; font-size: 14.5px; line-height: 1.55; }
.poster .by { display: flex; align-items: center; gap: 10px; }
.poster .by b { display: block; font-family: var(--thick); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
.poster .by .label { color: #555a5e; }
.poster .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 22px 18px; font-size: 12px; font-weight: 700; color: var(--band-muted); }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet .note { margin: 0; font-size: 12.5px; color: var(--muted); }
.toast { position: absolute; z-index: 30; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--band); color: var(--band-ink); font-size: 14px; font-weight: 700; padding: 9px 18px; border-radius: 999px; animation: fade .2s ease-out; }

/* reading mode: an eased, staggered fold. The names fade first, the portraits shrink in a left-to-right wave,
   the title lifts away and the composer sinks; reversing plays it back the other way. */
.app { --ease: cubic-bezier(.22, 1, .36, 1); }
.mast { max-height: 120px; overflow: hidden; transition: max-height .55s var(--ease), padding .55s var(--ease), opacity .35s ease, transform .55s var(--ease); }
.cast { transition: padding .55s var(--ease); }
.who { transition: width .5s var(--ease), gap .5s var(--ease); transition-delay: calc(var(--i, 0) * 28ms); }
.tile { transition: width .5s var(--ease), height .5s var(--ease); transition-delay: calc(var(--i, 0) * 28ms); }
.who .nm { max-height: 18px; overflow: hidden; transition: max-height .4s var(--ease), opacity .2s ease; }
.ondot { transition: transform .4s var(--ease); transform-origin: bottom right; }
.qline { transition: padding .5s var(--ease); }
.qline .eyebrow { display: block; max-height: 20px; overflow: hidden; transition: max-height .4s var(--ease), opacity .25s ease; }
.asked { transition: font-size .5s var(--ease); }
.compose { max-height: 220px; overflow: hidden; transition: max-height .55s var(--ease), padding .55s var(--ease), opacity .3s ease, transform .55s var(--ease), border-top-width .55s; }
.card { transition: box-shadow .5s ease; }

.app.reading .mast { max-height: 0; padding-top: 0; opacity: 0; transform: translateY(-14px); }
.app.reading .cast { padding-block: 10px 10px; }
.app.reading .who { width: 40px; gap: 0; }
.app.reading .tile { width: 36px; height: 36px; }
.app.reading .ondot { transform: scale(.75); }
.app.reading .who .nm { max-height: 0; opacity: 0; }
.app.reading .qline { padding-block: 10px 0; }
.app.reading .qline .eyebrow { max-height: 0; opacity: 0; }
.app.reading .asked { font-size: 19px; }
.app.reading .compose { max-height: 0; padding-block: 0; opacity: 0; transform: translateY(18px); border-top-width: 0; }
.app.reading .card { box-shadow: 0 14px 34px -18px rgba(10, 20, 18, .35); }
/* on the way back, names and title wait for the portraits to grow before fading in */
.app:not(.reading) .who .nm { transition-delay: .18s; }
.app:not(.reading) .mast { transition-delay: 0s, 0s, .15s, 0s; }
.app:not(.reading) .qline .eyebrow { transition-delay: 0s, .15s; }

.card-b, .msg.them { cursor: zoom-in; }
.app.reading .card-b, .app.reading .msg.them { cursor: zoom-out; }

.fine { margin: -2px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
.fine button { border: 0; background: none; padding: 4px 2px; font: inherit; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.app.reading .fine { display: none; }
.card.nino { background: var(--band); color: var(--band-ink); }
.card.nino .label { color: var(--band-muted); }
.card.nino .card-b p:not(.medium) { color: var(--band-ink); }
.nino-av { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #161616; font-family: var(--thick); font-weight: 800; font-size: 18px; }
.nino-links { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
.nino-links a { min-height: 40px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none; border: 1.5px solid currentColor; color: inherit; }
.nino-links a:first-child { background: var(--gold); border-color: var(--gold); color: #161616; }
.about { border-radius: 14px; padding: 20px; background: var(--band); color: var(--band-ink); display: flex; flex-direction: column; gap: 10px; }
.about p { margin: 0; line-height: 1.55; }
.about p:first-child { font-weight: 700; font-size: 17px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<div class="app" id="app">

  const L = {
    vg: {
      quit: ['Quit your job to paint? Oh, my friend. I quit EVERYTHING. Art dealer, fired. Teacher, gone. Preacher, they asked me to leave. The church said I was too intense. The CHURCH.', 'Then I painted full time for ten years. Do you know who paid for that? My little brother Theo. Every month. Rent, bread, paint. I wrote him hundreds of letters, and most of them say “thank you” and “please send more.”', 'So here is my question for you. Do you have a Theo?', 'No Theo? Keep the job. Paint at night. The stars are better then anyway. I would know.'],
      sell: ['Selling. Ha. Let me tell you about selling. I made about 900 paintings in ten years. Do you know how many I sold while I was alive?', 'One. ONE. The Red Vineyard. I think the buyer felt sorry for me.', 'Now my sunflowers sell for more than a whole village. The market finally came around. It just needed a hundred years and for me to not be there.', 'So my advice: don’t paint for the market. The market is slow. Paint because you can’t stop. And maybe have a better plan than mine.'],
      done: ['How do you know it’s done? I’ll tell you my method. I paint until I run out of yellow.', 'And I never run out of yellow, because I keep asking Theo to send more yellow. So I am never done. You see the problem.', 'I painted the sunflowers again. And again. Several versions of the same vase. The sunflowers never complained. Very patient flowers.', 'Here’s the real answer: stop when it feels alive. Not perfect. Alive. Then paint the next one.'],
      family: ['My family? My father was a pastor. A very calm man. And then there was me.', 'I was the son with paint on his clothes, arguing with everyone, who invited a fellow painter to live with him and watched him leave after nine weeks. And then the ear thing. We don’t talk about the ear thing at Christmas.', 'But I had Theo. One brother who believed in me. That was enough to make 900 paintings.', 'You don’t need the whole family to get it. You need one person. Find your Theo. Then write them a lot of letters.'],
      age: ['Too late? I didn’t start painting until I was 27. Everyone in art class was younger than me and better at drawing hands.', 'And I was gone at 37. So I had about ten years. Ten! In those ten years: around 900 paintings, more than a thousand drawings, and a LOT of letters asking for money.', 'You think you’re late? You have more time than I had. You probably have better shoes too. I painted my shoes. They were terrible.', 'Start tomorrow morning. Actually, start tonight. The night sky is right there.'],
      food: ['Dinner? When I was broke, I skipped meals so I could buy paint. Bread, coffee and paint. That was the menu. Very artistic. Very bad for you.', 'Theo would write, “Vincent, are you eating?” And I would write back, “Yes,” and then buy more cobalt blue.', 'Then I painted a whole family eating potatoes in a dark little room. Now it’s in a museum. People line up to look at potatoes.', 'So please, make a real dinner. Then paint it. The potatoes deserve it.'],
      love: ['Love. Ah. I am a passionate man. Maybe too passionate.', 'I once invited my friend Gauguin to live with me in my little Yellow House in Arles. I decorated his room with sunflowers! I was so excited!', 'Nine weeks later he left, and I was missing part of an ear. So. Not my best roommate situation.', 'My advice? Love with your whole heart, but maybe not your whole ear. Go slower than I did. Much, much slower.'],
      block: ['Stuck? Go outside. Right now. Put on your shoes.', 'I painted wheat fields, olive trees, a café at night, my bedroom, a chair, and yes, a pair of old boots. Boots! People study those boots in universities now.', 'When I was in the hospital at Saint-Rémy, I painted the view from my window. That’s where The Starry Night came from. A window. I didn’t even go anywhere.', 'Inspiration is not lightning. It’s looking at ordinary things like they’re on fire. Your kitchen is on fire. Not literally. Go paint it.'],
      politics: ['Politics? My friend, I could not keep one roommate for longer than nine weeks. You think I have opinions on running a whole country?', 'I will tell you what I’ll do. I will write to Theo.', 'Dear Theo. There was an election. Everyone is very excited or very upset. I am painting a wheat field. Please send money. And paint. And maybe a newspaper.', 'Whatever happened, the sun still came up. I know, because I painted it every morning.'],
      any: [
        ['Let me write to my brother Theo about this. He always knows what to do.', 'Dear Theo. A stranger from the future has asked me a question. I have thought about it for a long time, walking through the wheat fields. I have no idea.', 'Also, please send money. And paint. And a hat. The sun here is very strong.', 'He will write back. Meanwhile, do the thing you love today. That’s what I always did, and look at me now. Famous. Dead, but famous.'],
        ['You know what I learned? I sold one painting in my whole life, and I still showed up every day to paint.', 'Every day. Rain, sun, wind blowing my easel over. I tied it down with ropes. People thought I was crazy. They were a little bit right.', 'But now people line up around the block to see my work. All because I kept going when nobody was clapping.', 'So whatever your question is, the answer is probably: show up tomorrow. The sunflowers will forgive you.']
      ]
    },
    pp: {
      quit: ['Quit your job? I never had a job. I was drawing like a master at 14. My father, an art teacher, saw my work and basically retired.', 'I know. Not helpful. You cannot be me. Nobody can. I’ve checked.', 'But here is what I can tell you. I made art every day until I was 91. Paintings, sculptures, plates, pots, anything that held still.', 'So don’t wait to quit. Make work now, every day, in the cracks. And sign everything. BIG signature. People respect a big signature.'],
      sell: ['When I was young in Paris, I was so broke I burned drawings to keep warm. True story. Sad story. Warm story.', 'Then I painted everything blue for years. Blue people, blue rooms, a blue guitar. Very sad. Nobody bought it. Who wants sadness over the couch?', 'So I switched to pink. Circus people, harlequins, rose colors. And suddenly the collectors came.', 'My advice: if it’s not selling, change one thing and keep going. Also, be charming at dinner parties. I sold more at dinner than in galleries.'],
      done: ['Done? I never finished anything. I just stopped and started something new. I made tens of thousands of artworks.', 'Tens. Of. Thousands. Paintings, drawings, prints, ceramics. I made plates. PLATES. I was never done with art.', 'People, I was done with sometimes. Art, never.', 'Here is my rule. When you’ve been fixing tiny details for an hour, it’s done. Walk away. Start a new one. The next one is always the important one.'],
      family: ['My father was an art teacher. Legend says when he saw my paintings as a teenager, he handed me his brushes and stopped painting forever.', 'So, family support? I ended my own father’s career at 13. Holidays were awkward.', 'And my own family later? Complicated. Wives, muses, children, and after I died, very many lawyers.', 'If your family thinks art is a hobby, fine. Let them. Keep making it. One day they’ll be fighting over who keeps your napkin doodles.'],
      age: ['Too old? I was making new work at 91. Ninety-one! Right up to the end.', 'In my 80s I was still changing styles, painting like a young man who just discovered paint. People said, “Pablo, slow down.” I said, “Why? So I can be bored?”', 'You are not old. You are a baby. A baby with a midlife crisis and a credit card.', 'Buy the canvas. Make something ugly first. Ugly is how everything new begins. Cubism looked ugly to everyone for years.'],
      food: ['Dinner? They say in Paris I would eat at a nice restaurant and then, at the end, draw a little something on the napkin.', 'The owner would look at the napkin, look at me, and say, “Monsieur Picasso, this is enough.” Dinner paid. Napkin on the wall.', 'I don’t recommend you try this. Unless you are me. Are you me? No.', 'So cook something simple. Eat with people you like. Argue about art. The best meals of my life were bread, wine and a good argument.'],
      love: ['Love? You are asking ME about love? Okay.', 'Every time I fell in love, I started a new period. Blue, Rose, Cubism, Neoclassical... My art history is basically my dating history.', 'Art historians don’t only study my brushwork. They study my relationships. With charts.', 'My honest advice: do not take relationship advice from me. Take it from Frida. Actually no, she married the same man twice. Take it from Bob Ross.'],
      block: ['Stuck? Good. Being stuck is when the interesting things happen.', 'Look at your problem from the front. Now from the side. Now from behind. Now put all three views in one picture at the same time.', 'Now you have a problem with two noses and an eye on the forehead. Beautiful. That’s Cubism. Braque and I invented it because we were bored of seeing things from one side.', 'When you’re stuck, change the rules. Paint with your other hand. Paint something blue. Break a plate and glue it back. Just don’t sit there.'],
      politics: ['You want my opinion on politics? I painted Guernica. About eleven feet tall, twenty-five feet wide. Bulls, horses, screaming, darkness.', 'That was my opinion. Very big opinion. Took up a whole wall.', 'And now, after people stood in front of it for eighty years, you want my opinion in a text message? With what, an emoji?', 'No. If you have strong feelings, don’t post them. Paint them. Eleven feet tall. Then we’ll talk.'],
      any: [
        ['I see your question from every angle at once. From the front, it’s a good question.', 'From the side, it has two noses. From behind, it’s asking for a sandwich.', 'This is how I see everything. It’s exhausting. It’s also why I’m famous.', 'My answer: whatever you’re doing, do it bolder. Nobody remembers the polite painting.'],
        ['I made tens of thousands of artworks. You want to know my secret?', 'I never asked anybody for permission. Not teachers, not critics, not my mother. Okay, sometimes my mother.', 'And you are here, asking a group chat of dead people. I respect it. Very surreal. Dalí would approve.', 'Stop asking. Start making. Then send me a picture. I’ll tell you it’s good, then quietly make a better version.']
      ]
    },
    cm: {
      quit: ['Don’t quit the job. Paint the job.', 'I painted the same haystack about 25 times. Same haystack. Sunrise, noon, snow, fog, sunset. The farmer thought I was crazy. The haystack did not mind.', 'So your office? Paint it at 9 a.m., when the light is hopeful. At noon, when it’s flat and depressing. At 5 p.m., when everyone is tired and golden.', 'Same office, three paintings, completely different light. When you have 25 of them, then quit. Or have a show. Either way, you’ll know.'],
      sell: ['Early on I was so broke I wrote letters begging friends for money. A critic named our whole movement after my painting just to make fun of it.', 'Then I discovered something. Collectors love a series.', 'One haystack, nobody cares. Twenty-five haystacks in different light? Suddenly everyone wants “their” haystack. Sunset haystack. Winter haystack.', 'So stop making one-offs. Paint the same thing ten times in ten moods. Give people a reason to collect. Haystacks paid for my garden.'],
      done: ['Done? Mon ami, I built a pond in my garden at Giverny. Dug it, planted the water lilies, built a little Japanese bridge.', 'Then I painted that pond for about 30 years. Around 250 water lily paintings. Some of them are the size of a room.', 'Am I done? No. The pond is never done. The light moves, the lilies move, the clouds move. I tried to finish and the weather said no.', 'A painting is done when it says what the light said in that moment. Then make another one. The light will say something new tomorrow.'],
      family: ['My family followed me to a little village called Giverny. And then they watched me spend 30 years digging a pond and staring at the water.', 'Not working. Staring. For hours. Very patient people.', 'I also had a schedule. Lunch at 11:30, sharp. If it was late, there were consequences. Mostly sulking.', 'If your family thinks it’s a hobby, invite them into it. Build them a little bridge. Japanese style. It’s very hard to argue with a nice bridge.'],
      age: ['Too late? I painted my giant water lilies in my 70s and 80s. With cataracts. I could barely see.', 'Everything looked yellow and muddy. I had to read the labels on my paint tubes to know which color I was using. Imagine. A painter reading labels like it’s a pharmacy.', 'Those late paintings? Some of the most loved things I ever made. People cry in front of them.', 'You can see your colors. You have no excuse. Go paint. And get your eyes checked. Very important.'],
      food: ['Dinner is serious. I took my meals very seriously. Lunch at 11:30, every day, on the dot. The whole household knew.', 'Why so early? The best light is in the morning, and I did not want to waste the good afternoon light chewing.', 'My dining room at Giverny was painted bright yellow, the kitchen blue. Eating in there was like eating inside a sunrise.', 'So make something simple, eat it somewhere with good light, then go outside and paint before the light leaves. That is my whole life plan.'],
      love: ['Love is like light on a cathedral.', 'I painted the front of Rouen Cathedral more than 30 times. Same building. Morning, it’s pink. Noon, it’s white. Evening, it’s gold and purple.', 'People said, “Claude, it’s the same church.” I said, “You’re not looking.”', 'Your person is the same. Different every hour. If you think you know everything about them, you stopped looking. Keep looking. That’s love.'],
      block: ['Stuck? Wait twenty minutes.', 'No, really. Stop painting and wait. The sun will move, a cloud will pass, and suddenly your same view is a whole new painting.', 'I used to set up several canvases outside and switch between them as the light changed. Canvas one at ten o’clock, canvas two at half past. Like a waiter with too many tables.', 'I am not lazy. I am an Impressionist. Inspiration isn’t something you chase. It shows up when the light changes. Just be there when it does.'],
      politics: ['I will not discuss the election at this hour.', 'The light is terrible. Everything looks flat and harsh. Nobody should form opinions in this light.', 'Come back at sunrise. Everything looks hopeful. Come back at sunset. Everything looks dramatic and a little tired. Same news, different light.', 'That’s my point. Everything changes with the light, including how people feel. Paint how you feel at sunrise. Save the sunset for later.'],
      any: [
        ['Ask me again at sunset.', 'Right now the light is flat and so is your question. I say this with love.', 'At sunset, everything is golden. Your question will look profound. Your face will look wonderful. Even your problems will glow a little.', 'That’s the secret of painting and of life. It’s not what you look at. It’s the light you look at it in.'],
        ['A critic once saw my painting Impression, Sunrise and called our whole group “Impressionists” as an insult.', 'He meant: these people can’t finish a painting. Lazy blurs.', 'We took the insult and named a whole movement after it. Now museums have entire wings with that word on the wall.', 'So whatever they say about you, keep it. Insults make excellent names.']
      ]

    fk: {
      quit: ['Quit your job? Mi amor, listen. I was going to be a doctor. Then a bus accident broke my body in many places when I was 18.', 'I spent months in bed in a cast. So my mother put a mirror above my bed, my father lent me his paints, and I painted the only model I had. Me.', 'I didn’t quit anything. Life quit on my plans. And I painted anyway, lying on my back.', 'So you don’t need to quit to start. Paint before work. Paint in bed. If I can paint lying down in a cast, you can paint on a Tuesday.'],
      sell: ['Paint what’s true. That’s what sells.', 'I painted myself again and again. My eyebrows, my mustache, my heartbreak, my hospital beds, my monkeys. People said, “Frida, this is too personal.” Then they couldn’t stop looking.', 'Now my face is on tote bags, socks, phone cases, magnets. Socks! I would have been very rich. And very annoyed about the socks.', 'So don’t paint what you think people want. Paint what’s true. And put a monkey in it. Everyone loves a monkey.'],
      done: ['It’s done when it’s honest.', 'If you are hiding something in the painting, it’s not done. If you are being polite, it’s not done. If it looks like a greeting card, mi amor, it is very much not done.', 'I painted my broken spine as a cracked column. I painted my heart outside my body. That’s when people said, “Okay, Frida, that one’s done.”', 'Add the thing you’re scared to show. Then step back. If your hands are shaking a little, it’s done.'],
      family: ['Family? Ha! I married Diego Rivera. Then I divorced him. Then I married him AGAIN. About a year later.', 'My parents called it the marriage of an elephant and a dove. I was the dove. He was very much the elephant.', 'So believe me, I know complicated families. And I painted all of them anyway. Parents, grandparents, a whole family tree with me in the middle as a little girl.', 'If they think art is a hobby, paint them. A little weird. With strong eyebrows. They will be offended, and then they’ll hang it in the living room.'],
      age: ['Too late? Mi amor, I spent so much of my life in casts, corsets and hospital beds. I had more than 30 surgeries.', 'And I still made around 200 paintings. Some of them lying flat, with a special easel over my bed.', 'For my first solo show in Mexico, the doctors said I couldn’t get out of bed. So I had my bed carried into the gallery. I arrived IN my bed. Like a queen.', 'Your age is not a cast. You are not stuck in bed. Get up. Or, if you must, bring the bed with you.'],
      food: ['Make something colorful! At Casa Azul, my blue house, every meal was a fiesta. Bright plates, flowers, fruit, parrots watching from the trees.', 'Diego loved to eat. I loved to set the table like a painting. Mole, tortillas, fruit piled up like a still life.', 'Food is not just fuel. It’s a celebration that you’re alive. And believe me, I knew how lucky I was to be alive.', 'So tonight, cook something with color in it. Put flowers on the table. Invite a friend. And mind the parrot, he steals tortillas.'],
      love: ['I married the same man twice. TWICE. So don’t come to me surprised about second chances. I am the second-chances expert.', 'Diego was a great painter, a terrible husband, and a very large man. Our studio houses were connected by a little bridge, so we could live together and also get away from each other. Genius.', 'Two houses, one bridge. Write that down. That’s my relationship advice.', 'Love loudly. Forgive slowly. And make sure it’s love and not just a very beautiful mural.'],
      block: ['Stuck? Look in the mirror.', 'No, really. When I had nothing else, I had my face. I painted myself so many times because I was alone so often, and I was the subject I knew best.', 'Paint what you see AND what you feel at the same time. If your heart feels outside your body, paint it outside your body. Nobody will arrest you.', 'And mi amor, whatever you do, don’t you dare pluck those eyebrows. That’s where the power is.'],
      politics: ['Ha! You want politics from me? Mi amor, I have a lot of opinions. A LOT. Diego and I argued about politics at breakfast, lunch and dinner.', 'But this is a happy group chat in heaven, so I will keep them in my sketchbook.', 'I’ll only say this: whatever you believe, show up as yourself. Wear something bold. Flowers in your hair. Very loud flowers.', 'Then go paint how you feel about it. Honestly. That’s the only vote a painting gets.'],
      any: [
        ['Mi amor, put yourself in the middle of the painting.', 'Not the corner. Not hiding behind a vase. The MIDDLE. Looking straight at people. With eyebrows.', 'I spent my life being told to be smaller, quieter, more ladylike. I wore the big dresses and painted the mustache anyway.', 'Whatever your question is, the answer is: be more you. Louder. Then add flowers.'],
        ['I keep monkeys, parrots, dogs, a little deer and a lot of opinions in my blue house.', 'Not one of those animals has ever asked anyone for advice. They just live. Loudly. They eat, they scream, they sit in the sun.', 'The monkey doesn’t wonder if it’s a real artist. It just throws things.', 'Be more like the monkey. Make the thing. Throw some paint. Scream a little. Then sit in the sun.']
      ]

    aw: {
      quit: ['Oh. Gee. I had a job. I was a commercial illustrator. I drew shoes for magazine ads. Lots of shoes. Very successful shoes.', 'Then I started painting the stuff everybody saw every day and nobody thought was art. Soup. Coke bottles. Money. Movie stars.', 'People got really mad. Then they paid a lot of money. It’s funny how that works.', 'So keep the job and steal from it. Whatever bores you at work, paint 32 of it. Boredom is just inventory.'],
      sell: ['Here’s my secret. Don’t make one painting. Make 50 prints of it.', 'One painting, that’s art. Fifty prints, that’s a business. Five hundred, that’s a factory. I literally called my studio The Factory.', 'I had assistants making the work while I went to parties. People said, “Andy, you didn’t even paint this.” I said, “Gee, I know. Isn’t that great?”', 'So make editions. Make it easy to buy you. Then go to a party and don’t say very much. People will think you’re deep.'],
      done: ['It’s done when you get bored.', 'I got bored really fast. That’s why I made so many. Bored, next. Bored, next. Thirty-two soup cans. One for every flavor.', 'Some people paint one painting for ten years. I could never. I’d lose interest after lunch.', 'If you’ve been looking at it for an hour and you’re not excited anymore, it’s done. Print it. Sign it. Make a new one in a different color.'],
      family: ['My mother lived with me in New York for about 20 years. She did the lettering on some of my early work. Her handwriting was better than mine.', 'She didn’t totally understand the soup cans. But she knew a lot about soup, so she respected them.', 'So hire your family. They’re cheap, they’re loyal, and they already think you’re strange. Great business model.', 'And if they think it’s a hobby, sell something. Then frame the receipt. Families respect receipts.'],
      age: ['Age? I wore a silver wig for years. Big. Messy. Silver.', 'So nobody knew how old I was. Young people thought I was old. Old people thought I was strange. Everybody thought I was famous.', 'That’s the trick. If you look the same age forever, you can never be too late for anything.', 'So no, it’s not too late. Get a wig. Make something. Wear sunglasses inside. Nobody will check.'],
      food: ['Soup. I ate the same soup for lunch for about 20 years.', 'Every day. Same soup. I never had to decide anything at lunch. I saved so much brain space. I used it to think about soup.', 'Then I painted 32 cans of it, and now museums have my lunch on the wall.', 'So for dinner, pick one thing you like and eat it every day. It’s very calming. And if it becomes famous, I want credit.'],
      love: ['Love? I’d tape-record it.', 'I recorded everything. Phone calls, parties, conversations. I packed my whole life into boxes and called them Time Capsules. Hundreds of them.', 'So with love, you’d have proof of who said what. Very romantic. Very helpful in arguments.', 'Okay, real advice. Be interested in the other person. Ask questions. Listen a lot. It worked at parties. People thought I was fascinating and I barely said anything.'],
      block: ['Stuck? Go to the grocery store.', 'Look at the cans. The boxes. The labels. Everything you need is already on a shelf. Somebody designed all of that. It’s art nobody calls art.', 'I painted soup cans, Brillo boxes, dollar bills. Things so normal nobody noticed them anymore. Then everybody noticed.', 'Stop looking for something special to paint. Paint the boring stuff really, really carefully. Then repeat it until it stops being boring.'],
      politics: ['Gee. An election.', 'You know what an election is? It’s the same soup with a new label. And everybody gets very, very excited about the label.', 'Some people love the new label. Some people hate the new label. It’s all over the TV. Very good for ratings.', 'I’d make 32 prints of the results in different colors and sell them by Thursday. That’s my political statement.'],
      any: [
        ['Gee. That’s a good question.', 'I’ll make 32 copies of it. In pink, in yellow, in green. Then it’ll look really important.', 'That’s the thing. Say something once, it’s a question. Say it 32 times, it’s art.', 'Anyway. Whatever you’re thinking about, make more of it. Way more than seems normal.'],
        ['I don’t know.', 'I’ll put it on a silkscreen and see if it gets more interesting.', 'Most things get more interesting on a silkscreen. Soup did. Cows did. I made cow wallpaper. That’s real.', 'If your life feels boring, maybe it just needs a brighter color and a lot more copies.']
      ]

    sd: {
      quit: ['Dalí was expelled from art school. Twice. The second time, Dalí told the professors they were not qualified to judge him.', 'It was the best career move Dalí ever made. Very rude. Very effective.', 'So yes, you may quit. But do not quit quietly. Quietly is for accountants.', 'Quit with drama. Wear a cape. Bring a pet. Then go home and paint for twelve hours, because drama without work is just a costume.'],
      sell: ['Dalí designed the logo for a lollipop. Think about that. Millions of children eat Dalí’s work every day.', 'Dalí also made jewelry, furniture, perfume bottles, a lobster telephone, a sofa shaped like lips, and a dream sequence for Hitchcock.', 'Dalí said yes to everything. People called Dalí a sellout. Dalí called them back on the lobster telephone to say thank you.', 'So put your art on candy. On spoons. On sofas. On anything. Dalí would sign a pineapple. Dalí probably did.'],
      done: ['A painting is done when the clocks finish melting.', 'For Dalí, that is never. Dalí painted clocks drooping over branches like soft cheese. People ask why the clocks are melting. Because time is soft. Like camembert.', 'If time is soft, there is no deadline. Your painting is done when it is strange enough.', 'Look at it. Is it strange enough? No? Add an elephant with very long legs. Now look. Done.'],
      family: ['Dalí’s wife Gala was his muse, his manager, and the most frightening person Dalí ever met. Dalí adored her.', 'Dalí even bought her a castle. She only let Dalí visit if he asked in writing. In writing! Dalí wrote.', 'So you see, family is surreal. Everyone is a melting clock with opinions.', 'If your family thinks art is a hobby, invite them to a dinner where everything is gold and there is an anteater. They will never say hobby again.'],
      age: ['Age is a melting clock. It droops a little. It still tells time. Sort of.', 'Dalí was famous at 25, eccentric at 35, and wearing capes in public into his 80s. The mustache only got more confident with time.', 'Getting older is not the problem. Getting boring is the problem. Dalí never got boring. Dalí got pointier.', 'Start now, before your clock slides off the table. And grow something ridiculous. A mustache, a hat collection, a reputation.'],
      food: ['Dalí wrote an entire cookbook. Very strange feasts. Towers of crayfish, dishes with frightening names, everything gold.', 'Dalí also made a telephone with a lobster on it. You cannot eat that one. Dalí tried.', 'Tonight Dalí recommends dinner as theater. Plates that are too big. Candles. Dessert first. Speak only in whispers.', 'You will not eat better. But you will remember dinner. That is what Dalí wants for you. Memorable dinners.'],
      love: ['Dalí brought his ocelot, Babou, to restaurants. A wild cat. At dinner.', 'Once a lady was frightened, and Dalí told her it was a normal house cat he had painted to look wild. She believed him. That is the power of confidence.', 'So for your date, bring something unexpected. Not an ocelot. Dalí has been told this is now frowned upon.', 'If they stay, it is love. If they leave, at least you have your dignity. Dalí never had dignity, but Dalí had the ocelot.'],
      block: ['Dalí once gave a lecture in London wearing a full deep-sea diving suit. Helmet and everything.', 'Dalí almost suffocated. A man had to get the helmet off with a wrench. The audience thought it was part of the show. They clapped.', 'Inspiration arrives when you cannot breathe. Please do not do this. Dalí is required to say that.', 'Instead, try Dalí’s nap trick. Sit in a chair holding a key over a plate. When you drift off, the key drops, the clang wakes you, and you draw whatever was in your half-dream. Very effective. Very loud.'],
      politics: ['Dalí does not discuss elections. Dalí discusses Dalí.', 'Every few years people ask Dalí, “Who will you vote for?” and Dalí says, “The mustache.” Always the mustache.', 'The mustache has never lost. The mustache has no opponents. The mustache is waxed and pointing up, which is the correct direction for everything.', 'Whatever happened, Dalí suggests you look at it upside down. Things are less scary upside down. And more surreal. Paint that.'],
      any: [
        ['Dalí has read your question upside down, which is the correct way to read anything.', 'Dalí has also read it in a mirror, in a dream, and while holding an ocelot.', 'Dalí has consulted the melting clocks. They are very sleepy today.', 'The answer is: do the strangest version of whatever you’re afraid to do. Dalí guarantees nothing, but it will be memorable.'],
        ['Your question is very surreal. Dalí approves.', 'Dalí also approves of Dalí, very much. Dalí speaks about himself in the third person because one Dalí was not enough.', 'There is enough Dalí for everybody. Dalí checked.', 'Dalí’s advice: be confident about your weirdness. Nobody ever remembered a sensible artist.']
      ]

    jp: {
      quit: ['Sure. Quit. Move out of the city to a little farmhouse on Long Island. That’s what I did with Lee.', 'Then turn the barn into a studio. Put the canvas on the floor. Not on an easel. On the floor. Walk around it. Throw paint at it with a stick.', 'People thought I’d lost it. Then Life magazine ran a big spread asking if I was the greatest living painter in America.', 'Worked out. Mostly. But I had Lee, a barn and a lot of house paint. Make sure you’ve got your barn before you quit.'],
      sell: ['Life magazine ran a whole story asking if I was the greatest living painter in the United States. A question. They didn’t even answer it.', 'After that, everybody wanted to see the guy who drips paint. Some called me Jack the Dripper. It stuck.', 'Here’s the thing. My paintings didn’t change. The attention did.', 'So yeah, make the work. Then get somebody big to ask a question about you. Out loud. In print. Easy. Just kidding. Mostly not kidding.'],
      done: ['How do I know it’s done? I walk around all four sides of the canvas.', 'It’s on the floor, so I can come at it from anywhere. I keep walking, dripping, stopping. At some point it looks back at me.', 'When it looks back, it’s done. Or I throw one more drip. Usually I throw one more drip.', 'You’ll feel it. If you’re thinking too much, step away, have a coffee, look again. If it’s still alive, leave it alone.'],
      family: ['My wife, Lee Krasner, was a great painter too. Honestly, she knew more about modern art than most of the critics.', 'She kept things together. Found the sticks. Talked to the gallery. Told me when something was good and when I was being an idiot.', 'I was the youngest of five brothers. Nobody figured I’d amount to much. They were wrong. Then right. Then wrong again.', 'You don’t need the whole family. You need one person who knows where you left the sticks. Find that person.'],
      age: ['Too old? People called me Jack the Dripper, and I didn’t really get famous till my late 30s.', 'Before that, years of trying to paint like everybody else. Didn’t work. Painted like me. That worked.', 'Late is fine. Late means you’ve been around long enough to stop caring what people think.', 'Just be messy about it. Get your whole body in the work. Age doesn’t matter on the floor.'],
      food: ['Dinner? Easy.', 'Drip some sauce on a big white plate. Walk around it. Drip a little more. Splash some oil.', 'Call it Number 12. Charge thirty dollars. Restaurants do this now. They call it plating.', 'Real answer: Lee was a good cook. Make friends with a good cook. Paint in exchange.'],
      love: ['Love is like a drip painting.', 'Looks random. It’s not random. It’s like 80% not random. You’re making choices the whole time, even when it looks like a mess.', 'People looked at my paintings and said, “My kid could do that.” Sure. Your kid didn’t, though.', 'So in love: keep walking around it. Look from every side. Keep making choices. And don’t spill too much.'],
      block: ['Stuck? Get off the easel.', 'Put the canvas on the floor. Use a stick. A hardened brush. A turkey baster. I used turkey basters. Your kitchen is full of art supplies.', 'Use your whole body. Arm, shoulder, feet. There’s stuff from my studio floor stuck in some of my paintings. Nails. Buttons. A key. Probably a cigarette.', 'You’re not stuck. You’re just standing too still. Move around.'],
      politics: ['I’m from Wyoming. I don’t talk much.', 'You want my opinion on an election, I’ll drip red and blue on the floor and you decide what it means.', 'Some people will see a flag. Some will see a fight. Some will see a mess. All of ’em will argue about it at dinner.', 'That’s about as political as I get. Now leave me alone, I’m in the barn.'],
      any: [
        ['Yeah. Okay.', 'Put it on the floor.', 'Throw paint at it. Walk around it. Throw a little more.', 'That’s the answer to most things, really. Get it out of your head and onto the floor where you can see it.'],
        ['Don’t overthink it.', 'People think I didn’t think. Like I just flung paint around like a raccoon in a hardware store.', 'I thought. Hard. For a long time. Then I threw.', 'Think first. Then stop thinking and throw. That’s the trick. Most people never get to the throwing part.']
      ]

    br: {
      quit: ['Well now, I spent 20 years in the Air Force before I painted full time. Twenty years! I was a master sergeant, the fella who had to yell at folks.', 'I painted on my lunch breaks. Little landscapes on gold-mining pans, would you believe, and sold them to tourists up in Alaska.', 'Eventually the painting was making more than the Air Force. That’s when I hung up the uniform. And I promised I’d never yell again.', 'You don’t have to jump all at once, friend. Start with one happy little tree on the weekend. When the trees start paying the rent, then we’ll talk.'],
      sell: ['You know, I never charged the TV station for The Joy of Painting. Not one dime.', 'Folks thought I was crazy. But people watched, and then they wanted the paints and the brushes and the classes. That’s how the business grew.', 'Sometimes you give the joy away and it comes right back around. Like a happy little boomerang.', 'So share your process. Show folks how you do it. Let them fall in love with the making. The selling will follow along like a little squirrel.'],
      done: ['It’s done when you’re happy. That’s it. That’s the whole rule.', 'Here’s where folks get in trouble. They keep fiddling. A little here, a little there. Before you know it, that happy little cloud is a sad, muddy cloud.', 'I painted thousands of paintings in my life. You know how? I didn’t fiddle.', 'When you smile at it, put the brush down. Clean it off, give it a good whack on the easel leg, and go show somebody.'],
      family: ['Your family doesn’t have to understand right away, and that’s okay.', 'Some folks might think it’s just a hobby. Well, I’d paint them a little cabin by a lake, with a big old mountain behind it and a happy little path up to the door.', 'Everybody wants a cabin. Even the ones who think you’re silly. Especially them.', 'Give them a painting for their wall. Let them live with it a while. Pretty soon they’ll be telling their friends their kid’s an artist.'],

  const BANTER = [

    const pool = [...online].sort(() => Math.random() - .5).concat(IDS.filter((id) => !online.has(id)).sort(() => Math.random() - .5));
    for (const id of pool) { if (out.length >= 4) break; if (!out.includes(id)) out.push(id); }

  const NINO = {"eyebrow": "Living artist · Seattle", "lines": ["Hi, I’m Nino. The only one in this chat with a pulse.", "I’m a painter in Seattle. I made this because the greats figured out creative life the hard way. You don’t have to.", "Want feedback from a living artist? Come paint with us."], "links": [["See my art", "https://nino.studio"], ["Spice Art Club", "https://lab.nino.studio/spiceartclub"], ["@ninoyuniardi", "https://www.instagram.com/ninoyuniardi"]]};
  function ninoLinks() {
    const box = el('div', 'nino-links');
    NINO.links.forEach(([label, href]) => { const a = el('a', null, label); a.href = href; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); });
    return box;
  }
  let roundsAsked = 0, ninoShown = false;
  function addNinoCard(r) {
    const card = el('article', 'card nino');
    card.style.setProperty('--tc', 'var(--gold)');
    const head = el('header', 'card-h'), t = el('div');
    t.append(el('h3', null, 'Nino Yuniardi'), el('p', 'label', NINO.eyebrow));
    head.append(el('span', 'nino-av', 'N'), t);
    const body = el('div', 'card-b');
    NINO.lines.forEach((line, i) => addPara(body, line, true));
    card.append(head, body, ninoLinks());
    r.car.appendChild(card);
    r.cards.push({ id: 'nino', el: card, body, lines: [], aside: true });
    updatePager();
  }
  function openAbout() {
    closeSheets();
    const scrim = el('div', 'scrim'); scrim.onclick = (e) => { if (e.target === scrim) scrim.remove(); };
    const s2 = el('div', 'sheet'); s2.setAttribute('role', 'dialog'); s2.setAttribute('aria-modal', 'true'); s2.setAttribute('aria-label', 'About Nino Studio');
    s2.appendChild(el('h2', null, 'Made by Nino Studio'));
    const box = el('div', 'about');
    NINO.lines.forEach((line) => box.appendChild(el('p', null, line)));
    box.appendChild(ninoLinks());
    s2.appendChild(box);
    s2.appendChild(btn('Back to the chat', '', closeSheets));
    scrim.appendChild(s2); $('#app').appendChild(scrim);
    s2.querySelector('a, button').focus();
  }
  $('#madeby').addEventListener('click', openAbout);

  // ---------- composer ----------
  const q = $('#q');
  function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 110) + 'px'; }
  q.addEventListener('input', () => { autosize(); $('#send').disabled = !q.value.trim() || state.busy; });
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });
  $('#compose').addEventListener('submit', (e) => { e.preventDefault(); ask(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  STARTERS.forEach((s) => $('#starters').appendChild(btn(s, '', () => ask(s))));
  $('#pg-prev').onclick = () => { const r = rounds[cur]; goCard(r, activeIdx(r) - 1); };
  $('#pg-next').onclick = () => { const r = rounds[cur]; goCard(r, activeIdx(r) + 1); };
  $('#q-prev').onclick = () => showRound(cur - 1);
  $('#q-next').onclick = () => showRound(cur + 1);

  // ---------- opening state: an example round ----------
  buildCast();
  const sampleQ = 'Should I quit my job to paint full time?';
  const r0 = newRound(sampleQ);
  const firstTwo = castOrder.slice(0, 4);
  firstTwo.forEach((id) => { const c = addCard(r0, id); L[id].quit.forEach((line) => { addPara(c.body, line, false); c.lines.push(line); }); finishCard(c); });
  const b0 = pickBanter(firstTwo);
  if (b0) { const c = addCard(r0, b0[0], { aside: true }); addPara(c.body, b0[2], false); c.lines.push(b0[2]); }
  updatePager(); updateCast();
})();
</script>
</body>
